name: One-time favicon patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[favicon-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert favicon links
        shell: python
        run: |
          from pathlib import Path
          tag = b'<link rel="icon" type="image/svg+xml" href="./favicon.svg">'
          for filename, title in [('index.html', '<title>Countdown</title>'), ('Index.html', '<title>Tom & Jerry Countdown</title>')]:
              p = Path(filename)
              data = p.read_bytes()
              marker = title.encode('utf-8')
              if tag in data:
                  continue
              if marker not in data:
                  raise SystemExit(f'title marker not found in {filename}')
              nl = b'\r\n' if b'\r\n' in data[:500] else b'\n'
              data = data.replace(marker, marker + nl + tag, 1)
              p.write_bytes(data)
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Index.html
          git commit -m "chore: wire custom favicon [favicon-patch]"
          git push
